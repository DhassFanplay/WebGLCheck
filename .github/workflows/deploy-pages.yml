name: Deploy WebGLCheck to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Pull Git LFS files
        run: git lfs pull

      - name: Verify WebGL files
        run: |
          echo "Checking WebGL build files..."
          ls -lh Build/

          echo ""
          echo "Checking LFS files..."
          git lfs ls-files

          echo ""
          echo "Checking framework.js..."
          head -c 100 Build/WebGLCheck.framework.js || true

          echo ""
          echo "Checking data file..."
          ls -lh Build/WebGLCheck.data

          echo ""
          echo "Checking wasm file..."
          ls -lh Build/WebGLCheck.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
